name: Build VoxBangla for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check source and imports
        run: |
          python -m compileall -q vox_bangla.py
          python -c "import speech_recognition, pyaudio, pyautogui, pyperclip, bijoy_unicode, PyInstaller; print('All required packages imported successfully.')"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VoxBangla --collect-all speech_recognition --collect-all pyaudio --collect-all bijoy_unicode --hidden-import pyautogui --hidden-import pyperclip vox_bangla.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }

      - name: Prepare download package
        shell: pwsh
        run: |
          if (!(Test-Path '.\\dist\\VoxBangla.exe')) {
            throw 'Build failed: dist\\VoxBangla.exe was not created.'
          }
          New-Item -ItemType Directory -Force -Path '.\\release' | Out-Null
          Copy-Item '.\\dist\\VoxBangla.exe' '.\\release\\VoxBangla.exe'
          Copy-Item '.\\README_BN.txt' '.\\release\\README_BN.txt'
          Copy-Item '.\\NOTICE.txt' '.\\release\\NOTICE.txt'
          Compress-Archive -Path '.\\release\\*' -DestinationPath '.\\VoxBangla-Windows-x64.zip' -Force

      - name: Upload EXE and ZIP as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxBangla-Windows-x64
          path: |
            dist/VoxBangla.exe
            VoxBangla-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
